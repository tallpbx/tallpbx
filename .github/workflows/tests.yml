# TallPBX test pipeline.
#
# Purpose:
# Run the complete Pest feature/unit suite on every push to the main and release
# branches and on every pull request. This is the automated enforcement of the
# "Mandatory Pre-Claim Verification" gate in AGENTS.md, so a red suite can never
# reach a release again (v1.1.0 briefly shipped with a MariaDB-only migration
# that broke every SQLite-backed test).
#
# Environment notes:
# - `phpunit.xml` forces the in-memory SQLite connection, so no database service
#   is required.
# - A live Redis service IS required: the security incident tests exercise the
#   real Redis sliding-window counters (no fake is used).
# - PHP 8.5 matches the development toolchain and the Symfony 8.4 packages locked
#   in composer.lock (they require PHP >= 8.4.1); it is also what ships in production.

name: Tests

on:
  push:
    branches: [main, '1.*']
  pull_request:
    branches: [main, '1.*']

# Cancel superseded runs of the same branch or pull request to save runner minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  pest:
    name: Pest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Redis backing service used by the security incident rate-limit tests.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # pdo_sqlite/sqlite3 are required by the forced test database connection,
          # redis by the phpredis client used for incident counters, posix/pcntl by
          # the parallel test runner, intl by application formatting helpers.
          extensions: pdo_sqlite, sqlite3, redis, posix, pcntl, intl
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Same command developers run locally via `php artisan app:test`:
      # compact output plus parallel workers (paratest).
      - name: Run the Pest test suite
        run: php artisan test --compact --parallel
