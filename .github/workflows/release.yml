# TallPBX release publisher.
#
# Purpose:
# Turn every pushed vX.Y.Z tag into a GitHub Release whose body is that
# version's RELEASE-NOTES.md section — the plain-language, end-user summary.
# CHANGELOG.md stays the single source of truth for the complete record;
# RELEASE-NOTES.md is the curated summary prepended at each cut, newest
# first, mirroring the release practice of the superpowers project.
#
# Behaviour:
# - Triggered by any tag push matching "v*". The tag must point at a commit
#   that contains this workflow file, so it has to land on the series branch
#   before the first tag that should publish.
# - scripts/release-notes.sh exits non-zero unless BOTH CHANGELOG.md (dated
#   section) and RELEASE-NOTES.md (summary section) carry the tag's version,
#   so a premature or half-written release becomes a red workflow instead of
#   a release with an empty or wrong body.
# - A release that already exists for the tag is left untouched, so
#   re-pushing a moved tag never overwrites a published body.
#
# No local tooling is required: the release is created by the runner with the
# workflow's own token, which is why this job needs write access to contents.

name: Release

on:
  push:
    tags:
      - 'v*'

# The job must create a release object, so it needs more than the read-only
# default the test workflow uses.
permissions:
  contents: write

# One release per tag: never cancel an in-flight publish for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v5

      # The extractor prints the tag's RELEASE-NOTES.md section or exits
      # non-zero, which fails this step and therefore the whole workflow.
      - name: Extract the release notes for this tag
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-pushing a tag must not overwrite an already published body.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
