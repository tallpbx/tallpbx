version: '3'

rpc:
  listen: tcp://127.0.0.1:6091

server:
  command: "/usr/bin/php ./vendor/bin/roadrunner-worker"
  env:
    TALLPBX_WORKER_ROLE: "telephony"

http:
  address: "127.0.0.1:8090"
  middleware: ["static"]
  static:
    dir: "public"
    forbid: [".php", ".htaccess"]
  pool:
    num_workers: 2
    max_jobs: 10000
    allocate_timeout: 60s
    destroy_timeout: 60s
    supervisor:
      watch_tick: 1s
      ttl: 0s
      idle_ttl: 0s
      exec_ttl: 30s
      max_worker_memory: 128

logs:
  mode: production
  level: warn
  output: stdout
  encoding: json
